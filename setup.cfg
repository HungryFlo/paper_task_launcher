[metadata]
name = paper-task-launcher
version = 0.4.0
description = Launch an isolated Codex, Claude Code, or Kimi Code paper-learning task and record each turn.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.11
include_package_data = True

[options.packages.find]
include = paper_task_launcher*

[options.entry_points]
console_scripts =
    paper-task = paper_task_launcher.cli:main
